# Gateway configuration
schema: gateway/v1

server:
  addr: ":8080"
  read_timeout: 30s
  write_timeout: 60s
  read_header_timeout: 5s
  idle_timeout: 120s
  max_header_bytes: 1048576

php:
  binary: /usr/sbin/php-fpm
  # socket_path: /tmp/gateway.sock
  max_children: 20
  start_servers: 2
  min_spare: 2
  max_spare: 6
  max_requests: 500
  request_timeout: 60s

  # Extension configuration — pick a profile OR list individual extensions:
  # extension_profile: web-standard
  # extensions:
  #   - name: xdebug
  #     type: zend_extension
  #     enabled: true
  #   - name: opcache
  #     enabled: true
  # php_ini:
  #   - name: memory_limit
  #     value: 256M
  #   - name: upload_max_filesize
  #     value: 100M

routes:
  - path_prefix: /api/
    target: /index.php
    methods: [GET, POST, PUT, DELETE]
  - path_prefix: /admin/
    host: admin.example.com
    target: /admin/index.php
  - regex: "^/blog/(\\d{4})/(\\d{2})/(.+)$"
    target: /index.php
  - path: /old-page
    target: /new-page
    status: 301

logging:
  format: json
  level: info

security:
  symlink_mode: within_root
  max_body_size: 20MB
  protected_patterns:
    - .env
    - .git
    - .svn
    - .hg
    - "*.sql"
    - "*.sqlite*"
    - "*.log"
    - "*.bak"
    - composer.json
    - auth.json
    - php.ini
    - .user.ini
    - .htaccess
    - gateway.yaml
