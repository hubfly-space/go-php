# Go-PHP Gateway Sample Configuration File
schema: "1.0"

server:
  addr: "127.0.0.1:8080"
  read_timeout: "30s"
  write_timeout: "60s"
  read_header_timeout: "10s"
  idle_timeout: "120s"
  max_header_bytes: 1048576

php:
  binary: "/usr/sbin/php-fpm"
  max_children: 10
  start_servers: 2
  min_spare: 1
  max_spare: 3
  request_timeout: "30s"

routes:
  - path_prefix: "/assets"
    target: "public/assets"
  - path_prefix: "/"
    target: "public/index.php"

logging:
  format: "json"
  level: "info"

security:
  symlink_mode: "within_root"
  max_body_size: 10485760
  protected_patterns:
    - ".env*"
    - ".git/**"
    - ".svn"
    - "*.sql"
    - "*.sqlite*"
    - "*.log"
    - "*.bak"
    - "composer.json"
    - "gateway.yaml"
