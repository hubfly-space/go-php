name: Security & Load Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run (all, security, load, chaos)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - security
          - load
          - chaos

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  security:
    name: Security Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.suite == '' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'security' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run security tests
        run: |
          go test -tags=security -race -count=1 -timeout=120s -v ./test/security/...

  load:
    name: Load / Benchmark Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.suite == '' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'load' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run benchmarks
        run: |
          go test -tags=load -bench=. -benchmem -timeout=120s ./test/load/... | tee bench.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: bench.txt
          retention-days: 30

  chaos:
    name: Chaos Tests
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.suite == '' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'chaos' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install PHP-FPM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-fpm php-cli
      - name: Run chaos tests
        run: |
          go test -tags=chaos -race -count=1 -timeout=120s -v ./test/chaos/...
