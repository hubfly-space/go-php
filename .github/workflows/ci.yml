name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
      - name: go vet
        run: go vet ./...

  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Files not formatted:"
            gofmt -s -l .
            exit 1
          fi
      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          if [ -n "$(goimports -l -local github.com/go-php/gateway .)" ]; then
            echo "Files with unsorted imports:"
            goimports -l -local github.com/go-php/gateway .
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run unit tests with race detector
        run: go test -race -count=1 -timeout=120s ./internal/...
      - name: Run cmd tests
        run: go test -race -count=1 -timeout=30s ./cmd/... 2>/dev/null || true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
            -o bin/gateway ./cmd/gateway
      - name: Verify binary runs
        run: ./bin/gateway --version || true
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-linux-amd64
          path: bin/gateway
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Generate coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./internal/...
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
          retention-days: 14
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const total = execSync('go tool cover -func=coverage.out | tail -1').toString().trim();
            const body = `## Coverage Report\n\n\`${total}\`\n\n<details><summary>Coverage by package</summary>\n\n\`\`\`\n${execSync('go tool cover -func=coverage.out').toString()}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
